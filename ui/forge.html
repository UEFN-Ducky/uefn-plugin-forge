<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Forge</title>
  <style>
    /* Blender dark theme, simplified. The dock asked for this look. */
    :root { --bg:#1d1d1d; --surface:#2a2a2a; --header:#303030; --text:#e6e6e6; --muted:#9a9a9a; --line:#111; --accent:#4772b3; --err:#e06c75; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:12px/1.35 system-ui, Segoe UI, sans-serif; }
    button, select, input { font:inherit; color:var(--text); background:var(--header); border:1px solid transparent; border-radius:4px; }
    button { cursor:pointer; }
    svg { display:block; }
    .app { display:grid; grid-template-rows:auto 1fr auto; height:100%; }
    .top { display:flex; gap:6px; align-items:center; padding:4px 8px; background:var(--header); border-bottom:1px solid var(--line); }
    .top .sp { flex:1; }
    .top select, .top button, .hud select { padding:3px 8px; }
    .main { display:grid; grid-template-columns:44px 1fr 292px; min-height:0; }
    .rail { display:flex; flex-direction:column; gap:2px; padding:4px; background:var(--surface); border-right:1px solid var(--line); }
    .rail button, .hud button.icon {
      width:36px; height:32px; padding:0; display:grid; place-items:center; background:transparent; color:var(--text);
    }
    .rail button.on, .hud button.on, .tabs button.on { background:var(--accent); color:#fff; }
    .rail button:hover, .hud button:hover, .tabs button:hover { background:#3a3a3a; }
    .rail button.on:hover, .hud button.on:hover { background:var(--accent); }
    #view { position:relative; min-width:0; min-height:0; }
    #view canvas { display:block; width:100%; height:100%; }
    .hud {
      position:absolute; z-index:2; top:8px; left:50%; transform:translateX(-50%);
      display:flex; gap:2px; align-items:center; padding:3px;
      background:#2b2b2bee; border-radius:8px; box-shadow:0 2px 10px #0008;
    }
    .add-wrap { position:relative; }
    #prims, #files {
      position:absolute; z-index:5; top:28px; left:0; width:220px;
      background:var(--surface); border:1px solid #444; border-radius:6px; padding:4px;
      display:flex; flex-direction:column; gap:2px; max-height:280px; overflow:auto;
    }
    #prims[hidden], #files[hidden] { display:none; }
    #prims button, #files button { text-align:left; padding:4px 8px; background:transparent; }
    #prims button:hover, #files button:hover { background:#3a3a3a; }
    .side { overflow:auto; background:var(--surface); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
    .tabs { display:flex; gap:2px; padding:4px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface); z-index:1; }
    .tabs button { width:32px; height:28px; padding:0; display:grid; place-items:center; background:transparent; }
    #panel { padding:8px; display:flex; flex-direction:column; gap:6px; }
    .row { display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
    .row label { width:52px; color:var(--muted); }
    .row input[type="range"] { flex:1; }
    .row input, .row select { padding:3px 6px; background:var(--bg); border:1px solid #444; }
    .list { display:flex; flex-direction:column; gap:1px; }
    .item { display:flex; gap:4px; align-items:center; padding:2px 4px; border-radius:3px; cursor:pointer; }
    .item.on { background:#3d5688; }
    .item .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .icon-btn { width:22px; height:22px; padding:0; display:grid; place-items:center; background:transparent; color:var(--muted); }
    .icon-btn.off { opacity:.35; }
    .dot { width:8px; height:8px; border-radius:2px; flex:none; }
    .dim { color:var(--muted); }
    .status { padding:4px 8px; color:var(--muted); border-top:1px solid var(--line); min-height:22px; background:var(--header); }
    .err { color:var(--err); }
    h2 { margin:8px 0 4px; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
    .swatch { width:14px; height:14px; border-radius:3px; border:1px solid #444; flex:none; }
    .thumbs { display:flex; gap:6px; }
    .thumbs figure { margin:0; text-align:center; color:var(--muted); }
    .thumbs img { width:64px; height:64px; object-fit:cover; background:#111; border-radius:4px; }
    #ai { color:#8ab4ff; }
    .menu { padding:3px 8px; }
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <select id="scene" title="Scene"></select>
    <button id="new" class="menu" type="button" title="New scene">New</button>
    <button id="save-file" class="menu" type="button" title="Save this scene, its groups, and its meshes as a .forge file">Save</button>
    <div class="add-wrap">
      <button id="open-file" class="menu" type="button" title="Open a saved .forge file">Open</button>
      <div id="files" hidden></div>
    </div>
    <button id="mode" class="menu" type="button" title="Object or Edit mode">Object</button>
    <div class="add-wrap">
      <button id="add-btn" class="menu" type="button" title="Add a primitive">Add</button>
      <div id="prims" hidden></div>
    </div>
    <span class="sp"></span>
    <button id="undo" class="icon" type="button" title="Undo">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 8H4v4"/><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8"/></svg>
    </button>
    <button id="redo" class="icon" type="button" title="Redo">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 8h4v4"/><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8"/></svg>
    </button>
    <label class="row"><input id="follow" type="checkbox" /> Follow AI</label>
    <span id="ai" hidden>AI editing</span>
  </div>
  <div class="main">
    <nav class="rail">
      <button id="g-move" class="on" type="button" title="Move (G)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v18M3 12h18M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></svg>
      </button>
      <button id="g-rot" type="button" title="Rotate (R)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
      </button>
      <button id="g-scale" type="button" title="Scale (S)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20L20 4M14 4h6v6M4 14v6h6"/></svg>
      </button>
      <button id="extrude" type="button" title="Extrude (E)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 17l5-5 5 5M12 4v8"/></svg>
      </button>
      <button id="inset" type="button" title="Inset (I)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16"/><rect x="8" y="8" width="8" height="8"/></svg>
      </button>
      <button id="bevel" type="button" title="Bevel">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 18h8l8-8V4"/></svg>
      </button>
      <button id="loop" type="button" title="Loop cut">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <button id="sub" type="button" title="Subdivide">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4h16v16H4zM12 4v16M4 12h16"/></svg>
      </button>
      <button id="fill" type="button" title="Fill (F)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 19l7-14 7 14z"/></svg>
      </button>
      <button id="join" type="button" title="Join selected shapes">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="8" width="10" height="10"/><rect x="11" y="4" width="10" height="10"/></svg>
      </button>
      <button id="union" type="button" title="Boolean union of two selected shapes">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></svg>
      </button>
      <button id="bool" type="button" title="Boolean cut: second shape cuts the first">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="12" r="5"/><path d="M15 7a5 5 0 0 1 0 10"/></svg>
      </button>
      <button id="del" type="button" title="Delete faces (X)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 7h14M9 7V5h6v2M8 7l1 13h6l1-13"/></svg>
      </button>
    </nav>
    <div id="view">
      <div class="hud">
        <button id="sm-face" class="icon on" type="button" title="Faces">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M4 18L12 4l8 14z"/></svg>
        </button>
        <button id="sm-edge" class="icon" type="button" title="Edges">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 18L12 6l7 12"/></svg>
        </button>
        <button id="sm-vert" class="icon" type="button" title="Vertices">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="6" cy="17" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="17" r="2"/></svg>
        </button>
        <select id="snap" title="Grid snap">
          <option value="0">Snap off</option>
          <option value="10" selected>10 cm</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="512">512</option>
        </select>
      </div>
    </div>
    <aside class="side">
      <div class="tabs" id="tabs"></div>
      <div id="panel"></div>
    </aside>
  </div>
  <div class="status" id="status">Opening Forge…</div>
</div>
<script src="forge.bundle.js"></script>
</body>
</html>
