<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Forge</title>
  <style>
    :root { --bg:#141418; --surface:#1e1e24; --text:#e8e8ec; --muted:#9a9aa3; --line:#2e2e36; --accent:#6c8cff; --err:#f07178; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:12px/1.4 system-ui, Segoe UI, sans-serif; }
    button, select, input { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:3px 8px; }
    button { cursor:pointer; }
    button.on, button:hover { border-color:var(--accent); color:var(--accent); }
    .app { display:grid; grid-template-rows:auto 1fr auto; height:100%; }
    .bar { display:flex; gap:6px; align-items:center; padding:6px 8px; background:var(--surface); border-bottom:1px solid var(--line); flex-wrap:wrap; }
    .bar .sp { flex:1; }
    .main { display:grid; grid-template-columns:148px 1fr 280px; min-height:0; }
    #view { position:relative; min-width:0; min-height:0; }
    #view canvas { display:block; width:100%; height:100%; }
    .side, .tools { overflow:auto; background:var(--surface); padding:8px; }
    .tools { border-right:1px solid var(--line); }
    .side { border-left:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
    .tabs { display:flex; gap:4px; flex-wrap:wrap; }
    .tabs button { padding:2px 6px; }
    .row { display:flex; gap:4px; align-items:center; margin:3px 0; }
    .row label { width:64px; color:var(--muted); }
    .row input[type="range"] { flex:1; }
    .list { display:flex; flex-direction:column; gap:2px; }
    .item { display:flex; gap:4px; align-items:center; padding:3px 4px; border-radius:4px; cursor:pointer; }
    .item.on { background:#2a3148; }
    .item .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .dim { opacity:.55; }
    .status { padding:4px 8px; color:var(--muted); border-top:1px solid var(--line); min-height:22px; }
    .err { color:var(--err); }
    h2 { margin:8px 0 4px; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
    .swatch { width:14px; height:14px; border-radius:3px; border:1px solid var(--line); }
    #ai { color:var(--accent); }
  </style>
</head>
<body>
<div class="app">
  <div class="bar">
    <select id="scene"></select>
    <button id="new" type="button">New</button>
    <button id="mode" type="button">Object</button>
    <button id="sm-face" class="on" type="button">Face</button>
    <button id="sm-edge" type="button">Edge</button>
    <button id="sm-vert" type="button">Vert</button>
    <button id="g-move" class="on" type="button">Move</button>
    <button id="g-rot" type="button">Rotate</button>
    <button id="g-scale" type="button">Scale</button>
    <select id="snap" title="Grid snap">
      <option value="0">Snap off</option>
      <option value="10" selected>10 cm</option>
      <option value="50">50</option>
      <option value="100">100</option>
      <option value="512">512</option>
    </select>
    <button id="undo" type="button">Undo</button>
    <button id="redo" type="button">Redo</button>
    <label class="row"><input id="follow" type="checkbox" /> Follow AI</label>
    <span class="sp"></span>
    <span id="ai" hidden>AI editing</span>
  </div>
  <div class="main">
    <div class="tools">
      <h2>Add</h2>
      <div class="list" id="prims"></div>
      <h2>Edit</h2>
      <button id="extrude" type="button">Extrude</button>
      <button id="inset" type="button">Inset</button>
      <button id="bevel" type="button">Bevel</button>
      <button id="loop" type="button">Loop cut</button>
      <button id="sub" type="button">Subdivide</button>
      <button id="fill" type="button">Fill</button>
      <button id="del" type="button">Delete</button>
      <button id="bool" type="button">Boolean cut</button>
    </div>
    <div id="view"></div>
    <div class="side">
      <div class="tabs" id="tabs"></div>
      <div id="panel"></div>
    </div>
  </div>
  <div class="status" id="status">Opening Forge…</div>
</div>
<script src="forge.bundle.js"></script>
</body>
</html>
