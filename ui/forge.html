<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Forge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="forge.css" />
</head>
<body>
<div id="loading" role="status" aria-live="polite" hidden><div class="load-card"><div class="spin"></div><strong id="loading-name">Loading</strong><ol id="loading-steps"></ol><p id="loading-why" class="dim"></p></div></div>
<div class="app">
  <div class="top" role="toolbar" aria-label="Scene tools">
    <strong class="brand">FORGE</strong>
    <div class="add-wrap">
      <button id="proj-btn" class="menu" type="button" title="Projects, save and open" aria-haspopup="true" aria-expanded="false">Project ▾</button>
      <div id="proj-menu" role="menu" aria-label="Project menu" hidden>
        <input id="proj-search" type="search" placeholder="Find a project" aria-label="Find a project" />
        <div id="proj-list"></div>
        <button id="proj-new" type="button" role="menuitem">+ New project</button>
        <hr />
        <button id="new" type="button" role="menuitem" title="New scene">New scene</button>
        <button id="save-file" type="button" role="menuitem" title="Save this scene, its groups, and its meshes as a .forge file">Save</button>
        <button id="open-file" type="button" role="menuitem" title="Open a saved .forge file">Open…</button>
        <div id="files" hidden></div>
      </div>
    </div>
    <div id="scene-tabs" role="tablist" aria-label="Scenes"></div>
    <select id="scene" title="Scene" hidden></select>
    <select id="mode" title="Mode" aria-label="Mode">
      <option value="object">Object</option>
      <option value="edit">Edit</option>
      <option value="sculpt">Sculpt</option>
      <option value="weight">Weights</option>
      <option value="vpaint">Blend paint</option>
      <option value="tpaint">Texture paint</option>
    </select>
    <div class="add-wrap">
      <button id="add-btn" class="menu" type="button" title="Add a primitive">Add</button>
      <div id="prims" hidden></div>
    </div>
    <span class="sp"></span>
    <button id="undo" class="icon" type="button" title="Undo">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 8H4v4"/><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8"/></svg>
    </button>
    <button id="redo" class="icon" type="button" title="Redo">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 8h4v4"/><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8"/></svg>
    </button>
    <label class="row"><input id="follow" type="checkbox" /> Follow AI</label>
    <label class="row" title="Hide the snap controls and help text"><input id="simplify" type="checkbox" /> Simplify</label>
    <span id="ai" hidden>AI editing</span>
  </div>
  <div class="main">
    <aside id="proj" class="proj" aria-label="Project panel">
      <div id="proj-tree"></div>
      <input id="lib-search" type="search" placeholder="Search library" aria-label="Search library" />
      <div id="lib" role="tree" aria-label="Library"></div>
    </aside>
    <nav class="rail" aria-label="Modeling tools">
      <button id="g-select" type="button" title="Select (Q)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4l6 16 2-6 6-2z"/></svg>
      </button>
      <button id="g-move" class="on" type="button" title="Move (W)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v18M3 12h18M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></svg>
      </button>
      <button id="g-rot" type="button" title="Rotate (E)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
      </button>
      <button id="g-scale" type="button" title="Scale (R)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20L20 4M14 4h6v6M4 14v6h6"/></svg>
      </button>
      <button id="extrude" type="button" title="Extrude">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 17l5-5 5 5M12 4v8"/></svg>
      </button>
      <button id="inset" type="button" title="Inset (I)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16"/><rect x="8" y="8" width="8" height="8"/></svg>
      </button>
      <button id="bevel" type="button" title="Bevel">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 18h8l8-8V4"/></svg>
      </button>
      <button id="loop" type="button" title="Loop cut">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <button id="sub" type="button" title="Subdivide">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4h16v16H4zM12 4v16M4 12h16"/></svg>
      </button>
      <button id="fill" type="button" title="Fill boundary">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 19l7-14 7 14z"/></svg>
      </button>
      <button id="join" type="button" title="Join selected shapes">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="8" width="10" height="10"/><rect x="11" y="4" width="10" height="10"/></svg>
      </button>
      <button id="union" type="button" title="Boolean union of two selected shapes">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></svg>
      </button>
      <button id="bool" type="button" title="Boolean cut: second shape cuts the first">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="12" r="5"/><path d="M15 7a5 5 0 0 1 0 10"/></svg>
      </button>
      <button id="del" type="button" title="Delete faces (X)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 7h14M9 7V5h6v2M8 7l1 13h6l1-13"/></svg>
      </button>
    </nav>
    <div id="view">
      <div class="hud" role="toolbar" aria-label="Viewport tools"><span class="view-label">Perspective · Lit</span>
        <button id="sm-face" class="icon on" type="button" title="Faces">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M4 18L12 4l8 14z"/></svg>
        </button>
        <button id="sm-edge" class="icon" type="button" title="Edges">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 18L12 6l7 12"/></svg>
        </button>
        <button id="sm-vert" class="icon" type="button" title="Vertices">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="6" cy="17" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="17" r="2"/></svg>
        </button>
        <span id="cam-speed" class="dim" title="Hold right mouse to fly. Scroll changes speed.">Speed 4</span>
        <select id="snap" title="Grid snap in Fortnite units. One tile is 512.">
          <option value="0">Grid off</option>
          <option value="1">1</option>
          <option value="8">8</option>
          <option value="16">16</option>
          <option value="32">32</option>
          <option value="64">64</option>
          <option value="128">128</option>
          <option value="256">256</option>
          <option value="512" selected>512 tile</option>
          <option value="1024">1024</option>
          <option value="2048">2048</option>
        </select>
        <select id="rot-snap" title="Rotation snap">
          <option value="0">Rot off</option>
          <option value="5">5°</option>
          <option value="10">10°</option>
          <option value="15">15°</option>
          <option value="45">45°</option>
          <option value="90" selected>90°</option>
        </select>
        <select id="scale-snap" title="Scale snap">
          <option value="0" selected>Scale off</option>
          <option value="0.125">1/8</option>
          <option value="0.25">1/4</option>
          <option value="0.5">1/2</option>
          <option value="1">1</option>
        </select>
      </div>
      <div id="brush-bar" class="hud brush-bar" role="toolbar" aria-label="Brush" hidden>
        <select id="brush-kind" title="Brush" aria-label="Brush"></select>
        <select id="brush-target" title="What the brush changes" aria-label="Brush target"></select>
        <label class="dim">Radius <input id="brush-radius" type="number" min="1" step="1" value="20" aria-label="Brush radius in centimetres" /></label>
        <label class="dim">Strength <input id="brush-strength" type="range" min="0.01" max="1" step="0.01" value="0.5" aria-label="Brush strength" /></label>
        <input id="brush-color" type="color" value="#c0392b" title="Paint colour" aria-label="Paint colour" hidden />
        <label class="dim"><input id="brush-mirror" type="checkbox" /> Mirror X</label>
        <label class="dim"><input id="brush-invert" type="checkbox" /> Invert</label>
        <button id="brush-add" type="button" title="Add a shape key to sculpt into" hidden>+ Key</button>
        <button id="brush-sub" type="button" title="Round the mesh and give the brushes four times the vertices" hidden>Subdivide</button>
        <button id="brush-dec" type="button" title="Keep half the vertices, to get back under budget" hidden>Decimate</button>
        <button id="brush-done" type="button" title="Back to Object mode">Done</button>
      </div>
      <div class="view-help">RMB + WASD fly · Q / E down / up · Scroll speed · F frame selection · Alt-click ping</div>
    </div>
    <aside class="side" aria-label="Scene panels">
      <section id="outliner" aria-label="Outliner"></section>
      <div class="tabs" id="tabs"></div>
      <div id="panel" role="region" aria-label="Details"></div>
    </aside>
  </div>
  <div class="status" id="status"><span id="forge-version" aria-label="Forge version"></span><span id="status-text" role="status" aria-live="polite">Opening Forge…</span><span id="scene-stats"></span></div>
</div>
<script src="forge.bundle.js"></script>
</body>
</html>
